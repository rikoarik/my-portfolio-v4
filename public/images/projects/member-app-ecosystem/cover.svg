<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#f0efea"/>
  
  <g opacity="0.3">
    <line x1="200" y1="0" x2="200" y2="750" stroke="#dddbcf" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="750" stroke="#dddbcf" stroke-width="1"/>
  </g>

  <!-- Left Phone (Tenant A - Navy Brand Theme) -->
  <g transform="translate(180, 80)">
    <rect width="320" height="620" rx="38" fill="#1a2421"/>
    <rect x="8" y="8" width="304" height="604" rx="32" fill="#1a2421"/>
    <rect x="14" y="14" width="292" height="592" rx="26" fill="#fafaf9"/>

    <!-- Dynamic Island -->
    <rect x="110" y="22" width="90" height="20" rx="10" fill="#1a2421"/>

    <!-- App Header -->
    <text x="28" y="68" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Metro Club</text>
    <rect x="220" y="52" width="44" height="24" rx="12" fill="#e5e3dc"/>
    <text x="228" y="68" fill="#5a6663" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">VIP</text>

    <!-- Virtual Card -->
    <rect x="24" y="92" width="244" height="140" rx="16" fill="url(#cardGradA)"/>
    <text x="44" y="124" fill="#96a09d" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">VIRTUAL MEMBER CARD</text>
    <text x="44" y="156" fill="#fafaf9" font-family="monospace" font-size="16" font-weight="700">9402 •••• •••• 8812</text>
    <text x="44" y="196" fill="#f0efea" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">Ark Prasetya</text>
    <text x="200" y="196" fill="#d2d8d6" font-family="-apple-system, sans-serif" font-size="11">08/28</text>

    <!-- QRIS Scanner Button -->
    <rect x="24" y="248" width="244" height="60" rx="14" fill="#1a2421"/>
    <rect x="40" y="262" width="32" height="32" rx="8" fill="#3d4a47"/>
    <text x="84" y="278" fill="#fafaf9" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Scan QRIS Payment</text>
    <text x="84" y="296" fill="#96a09d" font-family="-apple-system, sans-serif" font-size="10">Pay at 1,000+ national merchants</text>

    <!-- Quick Services -->
    <text x="28" y="342" fill="#78827f" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">MEMBER SERVICES</text>
    
    <rect x="24" y="356" width="116" height="64" rx="12" fill="#ffffff" stroke="#e5e3dc"/>
    <text x="36" y="384" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Rewards</text>
    <text x="36" y="402" fill="#249d8f" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">4,200 Pts</text>

    <rect x="152" y="356" width="116" height="64" rx="12" fill="#ffffff" stroke="#e5e3dc"/>
    <text x="164" y="384" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Coupons</text>
    <text x="164" y="402" fill="#249d8f" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">3 Available</text>
  </g>

  <!-- Right Phone (Tenant B - Dark Amber Brand Theme) -->
  <g transform="translate(560, 60)">
    <rect width="320" height="620" rx="38" fill="#1a2421"/>
    <rect x="8" y="8" width="304" height="604" rx="32" fill="#2a3835"/>
    <rect x="14" y="14" width="292" height="592" rx="26" fill="#fafaf9"/>

    <rect x="110" y="22" width="90" height="20" rx="10" fill="#1a2421"/>

    <text x="28" y="68" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Retail Perks</text>
    <rect x="200" y="52" width="64" height="24" rx="12" fill="#eaf5f4"/>
    <text x="210" y="68" fill="#249d8f" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">PLATINUM</text>

    <!-- Virtual Card -->
    <rect x="24" y="92" width="244" height="140" rx="16" fill="url(#cardGradB)"/>
    <text x="44" y="124" fill="#e5e3dc" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">MULTI-BRAND PERKS</text>
    <text x="44" y="156" fill="#ffffff" font-family="monospace" font-size="16" font-weight="700">7710 •••• •••• 1920</text>
    <text x="44" y="196" fill="#fafaf9" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">Ark Prasetya</text>
    <text x="200" y="196" fill="#e5e3dc" font-family="-apple-system, sans-serif" font-size="11">12/27</text>

    <!-- QR Display -->
    <rect x="24" y="248" width="244" height="200" rx="14" fill="#ffffff" stroke="#e5e3dc"/>
    <text x="44" y="278" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Dynamic Payment QRIS</text>
    <text x="44" y="294" fill="#78827f" font-family="-apple-system, sans-serif" font-size="10">Scan at cashier to pay or claim points</text>
    
    <!-- QR Code Mockup Graphic -->
    <g transform="translate(86, 312)">
      <rect width="100" height="100" fill="#ffffff" stroke="#1a2421" stroke-width="2"/>
      <rect x="8" y="8" width="26" height="26" fill="#1a2421"/>
      <rect x="66" y="8" width="26" height="26" fill="#1a2421"/>
      <rect x="8" y="66" width="26" height="26" fill="#1a2421"/>
      <rect x="42" y="42" width="16" height="16" fill="#1a2421"/>
      <rect x="14" y="42" width="8" height="8" fill="#1a2421"/>
      <rect x="42" y="14" width="8" height="8" fill="#1a2421"/>
      <rect x="76" y="42" width="10" height="10" fill="#1a2421"/>
      <rect x="42" y="74" width="12" height="12" fill="#1a2421"/>
      <rect x="68" y="74" width="14" height="14" fill="#1a2421"/>
    </g>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="cardGradA" x1="24" y1="92" x2="268" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a2421"/>
      <stop offset="1" stop-color="#3d4a47"/>
    </linearGradient>
    <linearGradient id="cardGradB" x1="24" y1="92" x2="268" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a3835"/>
      <stop offset="1" stop-color="#78827f"/>
    </linearGradient>
  </defs>

  <!-- Editorial Info Badge -->
  <g transform="translate(80, 640)">
    <rect width="320" height="50" rx="8" fill="#ffffff" stroke="#dddbcf" stroke-width="1"/>
    <text x="20" y="24" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Member App Ecosystem</text>
    <text x="20" y="40" fill="#78827f" font-family="-apple-system, sans-serif" font-size="11">White-Label Architecture across 15+ Brands</text>
  </g>
</svg>
