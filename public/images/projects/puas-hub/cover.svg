<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#f4f3ee"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="750" stroke="#e5e3dc" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="750" stroke="#e5e3dc" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="750" stroke="#e5e3dc" stroke-width="1"/>
  </g>

  <!-- Device 1: Left / Front Phone -->
  <g transform="translate(240, 70)">
    <!-- Phone Body -->
    <rect width="340" height="640" rx="42" fill="#1a2421"/>
    <rect x="8" y="8" width="324" height="624" rx="36" fill="#1a2421"/>
    <!-- Screen Area -->
    <rect x="14" y="14" width="312" height="612" rx="30" fill="#ffffff"/>
    
    <!-- Dynamic Island / Speaker -->
    <rect x="120" y="24" width="100" height="24" rx="12" fill="#1a2421"/>
    
    <!-- App Header -->
    <text x="36" y="80" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">PUAS Hub</text>
    <rect x="250" y="66" width="32" height="32" rx="16" fill="#f4f3ee"/>
    <circle cx="266" cy="82" r="6" fill="#78827f"/>

    <!-- Balance Card -->
    <rect x="36" y="112" width="240" height="84" rx="16" fill="#1a2421"/>
    <text x="52" y="138" fill="#96a09d" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">Agent Balance</text>
    <text x="52" y="168" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Rp 4.850.000</text>
    <rect x="200" y="132" width="60" height="26" rx="13" fill="#2a3835"/>
    <text x="216" y="149" fill="#fafaf9" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Top Up</text>

    <!-- Services Grid -->
    <text x="36" y="222" fill="#78827f" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">DIGITAL PRODUCTS</text>
    
    <!-- Icons -->
    <rect x="36" y="238" width="52" height="52" rx="12" fill="#eaf5f4"/>
    <text x="48" y="268" fill="#249d8f" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Pulsa</text>
    
    <rect x="100" y="238" width="52" height="52" rx="12" fill="#eaf5f4"/>
    <text x="112" y="268" fill="#249d8f" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Data</text>

    <rect x="164" y="238" width="52" height="52" rx="12" fill="#eaf5f4"/>
    <text x="176" y="268" fill="#1a6f65" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">PLN</text>

    <rect x="228" y="238" width="52" height="52" rx="12" fill="#eaf5f4"/>
    <text x="238" y="268" fill="#249d8f" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Wallet</text>

    <!-- Recent Transactions -->
    <text x="36" y="324" fill="#78827f" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">RECENT TRANSACTIONS</text>

    <!-- Item 1 -->
    <rect x="36" y="338" width="244" height="54" rx="12" fill="#f4f3ee"/>
    <circle cx="60" cy="365" r="14" fill="#e5e3dc"/>
    <text x="84" y="358" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Telkomsel 50K</text>
    <text x="84" y="374" fill="#78827f" font-family="-apple-system, sans-serif" font-size="11">0812-3456-7890</text>
    <text x="216" y="362" fill="#249d8f" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Success</text>

    <!-- Item 2 -->
    <rect x="36" y="402" width="244" height="54" rx="12" fill="#f4f3ee"/>
    <circle cx="60" cy="429" r="14" fill="#e5e3dc"/>
    <text x="84" y="422" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">PLN Prepaid Token</text>
    <text x="84" y="438" fill="#78827f" font-family="-apple-system, sans-serif" font-size="11">3200-1122-3344</text>
    <text x="216" y="426" fill="#249d8f" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Success</text>

    <!-- Item 3 -->
    <rect x="36" y="466" width="244" height="54" rx="12" fill="#f4f3ee"/>
    <circle cx="60" cy="493" r="14" fill="#e5e3dc"/>
    <text x="84" y="486" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">GoPay Top Up 100K</text>
    <text x="84" y="502" fill="#78827f" font-family="-apple-system, sans-serif" font-size="11">0857-1122-9900</text>
    <text x="216" y="490" fill="#249d8f" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Success</text>
  </g>

  <!-- Device 2: Right Phone (Receipt Printing Screen) -->
  <g transform="translate(620, 110)">
    <!-- Phone Body -->
    <rect width="320" height="600" rx="40" fill="#2a3835"/>
    <rect x="8" y="8" width="304" height="584" rx="34" fill="#1a2421"/>
    <!-- Screen Area -->
    <rect x="14" y="14" width="292" height="572" rx="28" fill="#fafaf9"/>
    
    <!-- Top Bar -->
    <text x="32" y="60" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Receipt Details</text>
    
    <!-- Printable Paper Ticket Card -->
    <rect x="32" y="84" width="228" height="340" rx="12" fill="#ffffff" stroke="#e5e3dc" stroke-width="1"/>
    
    <text x="96" y="120" fill="#1a2421" font-family="monospace" font-size="13" font-weight="700">PUAS HUB</text>
    <text x="82" y="136" fill="#78827f" font-family="monospace" font-size="10">OFFICIAL RECEIPT</text>
    <line x1="48" y1="148" x2="244" y2="148" stroke="#e5e3dc" stroke-dasharray="4 4"/>
    
    <text x="48" y="174" fill="#78827f" font-family="monospace" font-size="11">TRX ID</text>
    <text x="140" y="174" fill="#1a2421" font-family="monospace" font-size="11">PUAS-9920194</text>

    <text x="48" y="198" fill="#78827f" font-family="monospace" font-size="11">PRODUCT</text>
    <text x="140" y="198" fill="#1a2421" font-family="monospace" font-size="11">PLN 100.000</text>

    <text x="48" y="222" fill="#78827f" font-family="monospace" font-size="11">METER NO</text>
    <text x="140" y="222" fill="#1a2421" font-family="monospace" font-size="11">1420-9944-11</text>

    <line x1="48" y1="240" x2="244" y2="240" stroke="#e5e3dc" stroke-dasharray="4 4"/>

    <text x="48" y="268" fill="#1a2421" font-family="monospace" font-size="11" font-weight="700">TOKEN PLN:</text>
    <text x="48" y="292" fill="#1a2421" font-family="monospace" font-size="12" font-weight="700">3921 - 8840 - 2910 - 4421</text>

    <line x1="48" y1="310" x2="244" y2="310" stroke="#e5e3dc" stroke-dasharray="4 4"/>

    <text x="48" y="336" fill="#1a2421" font-family="monospace" font-size="12" font-weight="700">TOTAL</text>
    <text x="160" y="336" fill="#1a2421" font-family="monospace" font-size="12" font-weight="700">Rp 102.500</text>

    <!-- Print Action Button -->
    <rect x="32" y="446" width="228" height="48" rx="12" fill="#1a2421"/>
    <text x="86" y="475" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Print via Bluetooth</text>
  </g>

  <!-- Editorial Card Label -->
  <g transform="translate(80, 640)">
    <rect width="280" height="50" rx="8" fill="#ffffff" stroke="#e5e3dc" stroke-width="1"/>
    <text x="20" y="24" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">PUAS Hub Mobile Suite</text>
    <text x="20" y="40" fill="#78827f" font-family="-apple-system, sans-serif" font-size="11">Production PPOB &amp; Thermal Printing</text>
  </g>
</svg>
