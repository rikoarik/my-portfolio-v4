<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#F3F2EE"/>

  <g opacity="0.4">
    <line x1="150" y1="0" x2="150" y2="750" stroke="#DDDBCF" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="750" stroke="#DDDBCF" stroke-width="1"/>
  </g>

  <!-- Title Label Header inside Graphic -->
  <g transform="translate(100, 60)">
    <text x="0" y="24" fill="#18181B" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Merchant Payment Device Integration Flow</text>
    <text x="0" y="46" fill="#71717A" font-family="-apple-system, sans-serif" font-size="12">Android POS / EDC Hardware · NFC Contactless · QRIS Engine · Thermal Printing</text>
  </g>

  <!-- Flow Diagram Elements -->
  <!-- 1. POS Hardware Terminal Mockup -->
  <g transform="translate(100, 150)">
    <!-- Terminal Body -->
    <rect width="280" height="460" rx="24" fill="#18181B"/>
    <rect x="8" y="8" width="264" height="444" rx="20" fill="#27272A"/>
    
    <!-- Screen -->
    <rect x="16" y="16" width="248" height="320" rx="12" fill="#FFFFFF"/>
    <text x="32" y="48" fill="#18181B" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Smart Terminal POS</text>
    <text x="32" y="66" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10">Awaiting Customer Payment</text>

    <!-- Amount Display -->
    <rect x="32" y="84" width="216" height="64" rx="8" fill="#F4F4F5"/>
    <text x="44" y="106" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10">TOTAL DUE</text>
    <text x="44" y="132" fill="#18181B" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Rp 150.000</text>

    <!-- Payment Modes -->
    <rect x="32" y="162" width="102" height="60" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="44" y="188" fill="#1D4ED8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">NFC Tap</text>
    <text x="44" y="206" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="9">Contactless</text>

    <rect x="146" y="162" width="102" height="60" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="158" y="188" fill="#15803D" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">QRIS Pay</text>
    <text x="158" y="206" fill="#4ADE80" font-family="-apple-system, sans-serif" font-size="9">Dynamic QR</text>

    <!-- Status -->
    <rect x="32" y="240" width="216" height="40" rx="8" fill="#18181B"/>
    <text x="68" y="265" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Reader Ready</text>

    <!-- Hardware Peripherals below Screen -->
    <!-- Card Slot indicator -->
    <rect x="40" y="360" width="200" height="8" rx="4" fill="#3F3F46"/>
    <!-- Keypad mock -->
    <circle cx="70" cy="400" r="10" fill="#3F3F46"/>
    <circle cx="115" cy="400" r="10" fill="#3F3F46"/>
    <circle cx="160" cy="400" r="10" fill="#3F3F46"/>
    <circle cx="205" cy="400" r="10" fill="#3F3F46"/>
  </g>

  <!-- Connective Arrows & State Machine Box -->
  <g transform="translate(420, 210)">
    <!-- Arrow 1 -->
    <line x1="0" y1="50" x2="60" y2="50" stroke="#71717A" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="60,46 70,50 60,54" fill="#71717A"/>

    <!-- State Transition Engine -->
    <g transform="translate(70, 0)">
      <rect width="320" height="340" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
      <text x="24" y="36" fill="#18181B" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Transaction State Machine</text>
      
      <!-- State 1 -->
      <rect x="20" y="56" width="280" height="52" rx="8" fill="#F4F4F5"/>
      <text x="36" y="80" fill="#18181B" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">1. Initialize Order &amp; Signature</text>
      <text x="36" y="96" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10">HMAC-SHA256 Payload Hash verification</text>

      <!-- State 2 -->
      <rect x="20" y="122" width="280" height="52" rx="8" fill="#EFF6FF"/>
      <text x="36" y="146" fill="#1D4ED8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">2. Await Hardware Authorization</text>
      <text x="36" y="162" fill="#3B82F6" font-family="-apple-system, sans-serif" font-size="10">Card APDU stream / QRIS webhook capture</text>

      <!-- State 3 -->
      <rect x="20" y="188" width="280" height="52" rx="8" fill="#F0FDF4"/>
      <text x="36" y="212" fill="#15803D" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">3. Settlement &amp; Receipt Stream</text>
      <text x="36" y="228" fill="#22C55E" font-family="-apple-system, sans-serif" font-size="10">ESC/POS packet delivery to thermal head</text>

      <!-- State 4 -->
      <rect x="20" y="254" width="280" height="60" rx="8" fill="#FAFAFA" stroke="#E4E4E7"/>
      <text x="36" y="278" fill="#18181B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Defensive Recovery Flow</text>
      <text x="36" y="296" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10">Auto-reverse on printer stall or reader timeout</text>
    </g>

    <!-- Arrow 2 -->
    <line x1="390" y1="170" x2="450" y2="170" stroke="#71717A" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="450,166 460,170 450,174" fill="#71717A"/>
  </g>

  <!-- 3. Hardware Peripheral / Receipt Printer Component -->
  <g transform="translate(890, 240)">
    <rect width="210" height="260" rx="16" fill="#18181B"/>
    <text x="24" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Thermal Printer</text>
    <text x="24" y="58" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="10">Bluetooth SPP / USB</text>

    <!-- Paper Eject Slot -->
    <rect x="20" y="74" width="170" height="12" rx="4" fill="#3F3F46"/>
    
    <!-- Paper Receipt Coming Out -->
    <rect x="30" y="86" width="150" height="130" rx="4" fill="#FFFFFF"/>
    <text x="46" y="112" fill="#18181B" font-family="monospace" font-size="10" font-weight="700">MERCHANT SALE</text>
    <text x="46" y="126" fill="#71717A" font-family="monospace" font-size="8">PAID VIA QRIS</text>
    <line x1="40" y1="134" x2="170" y2="134" stroke="#E4E4E7"/>
    <text x="46" y="152" fill="#18181B" font-family="monospace" font-size="10" font-weight="700">RP 150.000</text>
    <text x="46" y="168" fill="#16A34A" font-family="monospace" font-size="9">AUTH APPROVED</text>
  </g>

  <!-- Editorial Info Badge -->
  <g transform="translate(80, 680)">
    <rect width="320" height="44" rx="8" fill="#FFFFFF" stroke="#DDDBCF" stroke-width="1"/>
    <text x="16" y="22" fill="#09090B" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Merchant Payment Platform</text>
    <text x="16" y="36" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10">POS Hardware · NFC Contactless · QRIS Core Flow</text>
  </g>
</svg>
