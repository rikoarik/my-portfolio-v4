<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#F4F4F6"/>

  <g opacity="0.4">
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#E4E4E7" stroke-width="1"/>
    <line x1="0" y1="620" x2="1200" y2="620" stroke="#E4E4E7" stroke-width="1"/>
  </g>

  <!-- Browser Window Frame -->
  <g transform="translate(100, 70)">
    <rect width="1000" height="600" rx="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    
    <!-- Window Title Bar -->
    <rect width="1000" height="44" rx="14" fill="#FAFAFA"/>
    <line x1="0" y1="44" x2="1000" y2="44" stroke="#E4E4E7" stroke-width="1"/>
    
    <!-- Dots -->
    <circle cx="24" cy="22" r="5" fill="#EF4444"/>
    <circle cx="40" cy="22" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="22" r="5" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="250" y="8" width="500" height="28" rx="6" fill="#F4F4F5"/>
    <text x="440" y="26" fill="#71717A" font-family="-apple-system, sans-serif" font-size="12">lembar.app/documents</text>

    <!-- Sidebar -->
    <rect x="0" y="45" width="220" height="555" fill="#FAFAFA"/>
    <line x1="220" y1="45" x2="220" y2="600" stroke="#E4E4E7" stroke-width="1"/>

    <text x="24" y="85" fill="#18181B" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Lembar</text>
    
    <!-- Nav Items -->
    <rect x="16" y="110" width="188" height="34" rx="8" fill="#F4F4F5"/>
    <text x="36" y="132" fill="#18181B" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">All Documents</text>

    <text x="36" y="172" fill="#71717A" font-family="-apple-system, sans-serif" font-size="13">Review Queue</text>
    <text x="36" y="210" fill="#71717A" font-family="-apple-system, sans-serif" font-size="13">Audit Logs</text>
    <text x="36" y="248" fill="#71717A" font-family="-apple-system, sans-serif" font-size="13">Schema &amp; API</text>

    <!-- Main Content Area -->
    <g transform="translate(260, 75)">
      <text x="0" y="24" fill="#18181B" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Document Workflow Pipeline</text>
      <text x="0" y="44" fill="#71717A" font-family="-apple-system, sans-serif" font-size="12">Fastify API + Drizzle ORM + Next.js Server Components</text>

      <!-- Document Columns / Cards -->
      <!-- Column 1: Drafts -->
      <g transform="translate(0, 70)">
        <rect width="210" height="420" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="16" y="30" fill="#475569" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">DRAFTS (2)</text>
        
        <rect x="12" y="46" width="186" height="88" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="24" y="74" fill="#1E293B" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">API Gateway Contract</text>
        <text x="24" y="92" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">OpenAPI v3.1 Spec</text>
        <rect x="24" y="104" width="56" height="18" rx="4" fill="#F1F5F9"/>
        <text x="32" y="117" fill="#475569" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Fastify</text>

        <rect x="12" y="146" width="186" height="88" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="24" y="174" fill="#1E293B" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Merchant Settlement</text>
        <text x="24" y="192" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Drizzle migrations</text>
        <rect x="24" y="204" width="68" height="18" rx="4" fill="#EFF6FF"/>
        <text x="32" y="217" fill="#2563EB" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">PostgreSQL</text>
      </g>

      <!-- Column 2: In Review -->
      <g transform="translate(230, 70)">
        <rect width="210" height="420" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="16" y="30" fill="#D97706" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">IN REVIEW (1)</text>

        <rect x="12" y="46" width="186" height="104" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="24" y="74" fill="#1E293B" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Auth Token Rotation</text>
        <text x="24" y="92" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Security verification</text>
        <rect x="24" y="114" width="76" height="20" rx="4" fill="#FEF3C7"/>
        <text x="32" y="128" fill="#B45309" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Pending Lead</text>
      </g>

      <!-- Column 3: Published -->
      <g transform="translate(460, 70)">
        <rect width="210" height="420" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="16" y="30" fill="#16A34A" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">PUBLISHED (3)</text>

        <rect x="12" y="46" width="186" height="88" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="24" y="74" fill="#1E293B" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Core Services RFC</text>
        <text x="24" y="92" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Production release v1.2</text>
        <rect x="24" y="104" width="60" height="18" rx="4" fill="#DCFCE7"/>
        <text x="32" y="117" fill="#15803D" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Active</text>
      </g>
    </g>
  </g>

  <!-- Editorial Info Badge -->
  <g transform="translate(80, 680)">
    <rect width="290" height="44" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <text x="16" y="22" fill="#09090B" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Lembar Document Platform</text>
    <text x="16" y="36" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10">Next.js · Fastify · Drizzle ORM · PostgreSQL</text>
  </g>
</svg>
