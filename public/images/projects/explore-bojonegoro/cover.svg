<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#f4f3ee"/>

  <!-- Left Phone (Destination Guide Screen) -->
  <g transform="translate(240, 70)">
    <rect width="320" height="620" rx="38" fill="#1a2421"/>
    <rect x="8" y="8" width="304" height="604" rx="32" fill="#2a3835"/>
    <rect x="14" y="14" width="292" height="592" rx="26" fill="#ffffff"/>

    <rect x="110" y="22" width="90" height="20" rx="10" fill="#1a2421"/>

    <!-- App Header -->
    <text x="28" y="68" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Explore Bojonegoro</text>
    <text x="28" y="86" fill="#78827f" font-family="-apple-system, sans-serif" font-size="11">Discover Nature &amp; Culture</text>

    <!-- Search Bar -->
    <rect x="24" y="102" width="244" height="38" rx="10" fill="#f4f3ee"/>
    <text x="44" y="126" fill="#96a09d" font-family="-apple-system, sans-serif" font-size="11">Search destinations, heritage...</text>

    <!-- Destination Card 1 -->
    <rect x="24" y="154" width="244" height="150" rx="14" fill="#1a6f65"/>
    <rect x="24" y="154" width="244" height="150" rx="14" fill="url(#natureGrad)"/>
    <text x="40" y="244" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Kayangan Api</text>
    <text x="40" y="262" fill="#e5e3dc" font-family="-apple-system, sans-serif" font-size="11">Eternal geological flame site</text>
    <rect x="40" y="274" width="60" height="18" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="48" y="287" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Heritage</text>

    <!-- Destination Card 2 -->
    <rect x="24" y="318" width="244" height="130" rx="14" fill="#1a6f65"/>
    <rect x="24" y="318" width="244" height="130" rx="14" fill="url(#waterGrad)"/>
    <text x="40" y="394" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Waduk Pacal</text>
    <text x="40" y="412" fill="#e5e3dc" font-family="-apple-system, sans-serif" font-size="11">Historical reservoir &amp; scenery</text>
    <rect x="40" y="424" width="50" height="18" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="48" y="437" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">Nature</text>

    <!-- Offline Sync Banner -->
    <rect x="24" y="464" width="244" height="42" rx="10" fill="#eaf5f4" stroke="#eaf5f4"/>
    <text x="40" y="489" fill="#1a6f65" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Offline SQLite Cache Active</text>
  </g>

  <!-- Right Phone (Interactive Map View) -->
  <g transform="translate(620, 100)">
    <rect width="320" height="580" rx="38" fill="#1a2421"/>
    <rect x="8" y="8" width="304" height="564" rx="32" fill="#2a3835"/>
    <rect x="14" y="14" width="292" height="552" rx="26" fill="#f0efea"/>

    <rect x="110" y="22" width="90" height="20" rx="10" fill="#1a2421"/>

    <!-- Map Graphic Mockup -->
    <!-- Roads & Geometry -->
    <path d="M 20 180 Q 150 140 280 200" stroke="#d2d8d6" stroke-width="12" fill="none"/>
    <path d="M 120 40 L 120 500" stroke="#d2d8d6" stroke-width="10" fill="none"/>
    <path d="M 40 380 Q 160 360 280 420" stroke="#e5e3dc" stroke-width="14" fill="none"/>

    <!-- Pin 1 -->
    <circle cx="160" cy="180" r="16" fill="#e76f51"/>
    <circle cx="160" cy="180" r="6" fill="#ffffff"/>

    <!-- Pin 2 -->
    <circle cx="120" cy="360" r="16" fill="#249d8f"/>
    <circle cx="120" cy="360" r="6" fill="#ffffff"/>

    <!-- Map Info Card Bottom Sheet -->
    <g transform="translate(24, 380)">
      <rect width="244" height="110" rx="14" fill="#ffffff" stroke="#e5e3dc"/>
      <text x="20" y="32" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Selected: Kayangan Api</text>
      <text x="20" y="52" fill="#78827f" font-family="-apple-system, sans-serif" font-size="11">Ngandong, Bojonegoro</text>
      <rect x="20" y="68" width="204" height="30" rx="6" fill="#1a2421"/>
      <text x="80" y="88" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Start Navigation</text>
    </g>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="natureGrad" x1="24" y1="154" x2="268" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a6f65"/>
      <stop offset="1" stop-color="#1a6f65"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="24" y1="318" x2="268" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a6f65"/>
      <stop offset="1" stop-color="#1a6f65"/>
    </linearGradient>
  </defs>

  <!-- Editorial Info Badge -->
  <g transform="translate(80, 680)">
    <rect width="280" height="44" rx="8" fill="#ffffff" stroke="#dddbcf" stroke-width="1"/>
    <text x="16" y="22" fill="#1a2421" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Explore Bojonegoro</text>
    <text x="16" y="36" fill="#78827f" font-family="-apple-system, sans-serif" font-size="10">Kotlin · Android Native · Mapbox · Firebase</text>
  </g>
</svg>
